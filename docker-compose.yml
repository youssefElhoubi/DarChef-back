services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nest-api

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/cook-platform

    depends_on:
      mongo:
        condition: service_healthy

    restart: unless-stopped

  mongo:
    image: mongo:8

    container_name: nest-mongo

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: cook-platform

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


volumes:
  mongo_data: